<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<title>SyncHim · kinetic scene</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #1A1410;
    --texto: #F2E8DC;
    --ouro: #B8843D;
    --ouro-folha: #D4A857;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(to bottom, #5A1A2A 0%, var(--bg) 70%);
    color: var(--texto);
    font-family: 'EB Garamond', Georgia, serif;
    position: relative;
  }
  /* Imagem de fundo opcional (scene.imageUrl). Ocupa o frame inteiro
     com darkening overlay para o texto kinetic continuar legivel. */
  #bg-image {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: brightness(0.5) contrast(1.05);
  }
  #bg-image::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(26,20,16,0.30) 0%,
      rgba(26,20,16,0.60) 50%,
      rgba(26,20,16,0.88) 100%);
  }
  body::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.97  0 0 0 0 0.91  0 0 0 0 0.82  0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.04;
  }
  #scene {
    position: relative; z-index: 2;
    width: 1080px; height: 1920px;
    padding: 220px 120px;
    box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  #scene .body {
    font-size: 86px;
    line-height: 1.28;
    letter-spacing: -0.005em;
    font-weight: 500;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
  }
  /* Palavra ainda por dizer */
  #scene .body .w { color: rgba(242, 232, 220, 0.32); transition: color 0.18s ease, text-shadow 0.18s ease; }
  /* Palavra já dita */
  #scene .body .w.spoken { color: var(--texto); }
  /* Palavra a ser pronunciada AGORA — só cor + glow para evitar reflow */
  #scene .body .w.active {
    color: var(--ouro-folha);
    text-shadow: 0 0 28px rgba(212, 168, 87, 0.55), 0 3px 16px rgba(0,0,0,0.7);
  }
  /* Quando NÃO há wordTimes (preview estático ou cena sem voz) — mostra tudo em creme. */
  #scene.no-karaoke .body .w { color: var(--texto); }

  #scene.cta .body { color: var(--ouro-folha); font-size: 78px; }
  #scene.capa .body { font-size: 96px; font-weight: 600; }

  .mark { position: absolute; bottom: 110px; color: var(--ouro-folha); font-size: 38px; letter-spacing: 0.2em; }
  .estrela { color: var(--ouro-folha); font-size: 46px; margin-top: 60px; }
</style>
</head>
<body>
<div id="bg-image" style="display:none"></div>
<div id="scene"><div class="body"></div></div>
<script>
  function stripMarkdown(s) {
    return (s || '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/_(.+?)_/g, '$1')
      .replace(/[*_]/g, '');
  }
  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function splitWords(text) {
    // Mesma lógica do alignmentToWordTimes: separa por whitespace,
    // pontuação fica colada à palavra anterior.
    return text.split(/\s+/).filter(Boolean);
  }
  function renderWords(text, activeIdx) {
    const words = splitWords(stripMarkdown(text));
    return words.map((w, i) => {
      const cls = activeIdx == null ? 'w' :
        i < activeIdx ? 'w spoken' :
        i === activeIdx ? 'w active' :
        'w';
      return '<span class="' + cls + '">' + escapeHtml(w) + '</span>';
    }).join(' ');
  }
  function fitToHeight(el, maxH, minPx) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 80;
    while (el.scrollHeight > maxH && size > minPx && guard-- > 0) { size -= 2; el.style.fontSize = size + 'px'; }
  }

  function applyBrand(b) {
    if (!b) return;
    const r = document.documentElement.style;
    if (b.bg) r.setProperty('--bg', b.bg);
    if (b.texto) r.setProperty('--texto', b.texto);
    if (b.ouro) r.setProperty('--ouro', b.ouro);
    if (b.ouroFolha) r.setProperty('--ouro-folha', b.ouroFolha);
  }

  const d = window.SCENE_DATA || {};
  applyBrand(d.brand);

  const imageUrl = d.imageUrl || (d.design && d.design.imageUrl);
  if (imageUrl) {
    const bg = document.getElementById('bg-image');
    bg.style.display = 'block';
    bg.style.backgroundImage = `url(${JSON.stringify(imageUrl).slice(1, -1)})`;
  }

  const root = document.getElementById('scene');
  const layout = d.layout || 'kinetic-line';
  root.classList.add(layout === 'cta' ? 'cta' : (layout === 'capa' ? 'capa' : 'kinetic'));

  // activeWordIdx: índice (0-based) da palavra actualmente pronunciada.
  // Se null/undefined, modo "sem karaoke" — todas as palavras em creme cheio.
  const activeIdx = (d.activeWordIdx == null) ? null : Number(d.activeWordIdx);
  if (activeIdx == null) root.classList.add('no-karaoke');

  const body = root.querySelector('.body');
  body.innerHTML = renderWords(d.body || '', activeIdx);

  if (layout === 'cta' || layout === 'capa') {
    const star = document.createElement('div');
    star.className = 'estrela';
    star.textContent = '✦';
    root.appendChild(star);
  }
  if (layout !== 'capa') {
    const m = document.createElement('div');
    m.className = 'mark';
    m.textContent = 'SYNCHIM';
    root.appendChild(m);
  }

  // Permite que o renderer mude o estado sem recarregar a página inteira.
  window.setActiveWord = function(idx) {
    const i = (idx == null) ? null : Number(idx);
    if (i == null) root.classList.add('no-karaoke');
    else root.classList.remove('no-karaoke');
    body.innerHTML = renderWords(d.body || '', i);
  };

  document.fonts.ready.then(() => {
    fitToHeight(body, root.clientHeight - 400, 36);
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
