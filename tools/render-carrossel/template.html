<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<title>SyncHim · slide</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #1A1410;
    --bg-top: #5A1A2A;
    --texto: #F2E8DC;
    --ouro: #E08496;
    --ouro-folha: #E08496;
    --acento: #E08496;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--texto); }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    font-family: 'EB Garamond', Georgia, serif; position: relative;
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg) 60%);
  }

  /* Pergaminho subtilissimo — aquece o gradiente sem ruido visivel */
  body::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.97  0 0 0 0 0.91  0 0 0 0 0.82  0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.05;
  }

  /* Numero fantasma — so em slides de conteudo sem imagem (texto-puro).
     Da identidade editorial sem ser decorativo: e o numero do slide,
     em italico, dourado esmaecido, gigante no canto. */
  .ghost-num {
    position: absolute; top: 130px; right: 90px; z-index: 1;
    font-family: 'EB Garamond', Georgia, serif; font-style: italic;
    font-size: 320px; line-height: 1; color: var(--ouro-folha);
    opacity: 0.10; letter-spacing: -0.04em;
    pointer-events: none;
  }
  .mode-text.layout-capa .ghost-num,
  .mode-text.layout-cta .ghost-num,
  .mode-text.layout-assinatura .ghost-num,
  .mode-split .ghost-num,
  .mode-full .ghost-num { display: none; }

  /* === MARCA top-left com estrela persa oficial === */
  .brand {
    position: absolute; top: 34px; left: 44px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    filter: drop-shadow(0 2px 12px rgba(0,0,0,0.5));
  }
  .brand .icon {
    width: 40px; height: 40px; color: var(--ouro-folha); line-height: 0;
  }
  .brand .icon svg { width: 100%; height: 100%; display: block; }
  .brand .name {
    font-size: 24px; font-style: italic; font-weight: 500;
    color: var(--texto); opacity: 0.95;
    letter-spacing: 0.02em;
  }

  /* === CRÉDITO bottom-left === */
  .credit {
    position: absolute; bottom: 38px; left: 48px; z-index: 10;
    font-size: 13px; color: var(--texto); opacity: 0.45;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  /* === PAGINAÇÃO bottom-center === */
  .pagination {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 7px;
  }
  .pagination .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(242,232,220,0.25); }
  .pagination .dot.active { background: var(--texto); }

  /* === MODO SPLIT (estilo FreeMe) ===
     Imagem domina ~62% no topo. Gradiente longo separado (fora do
     image-area) faz a ponte entre imagem e texto. Texto fica nos ~42%
     inferiores sem corte horizontal abrupto. */
  .mode-split .image-area {
    position: absolute; top: 0; left: 0; right: 0; height: 62%;
    overflow: hidden; z-index: 0;
  }
  .mode-split .image-area img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .mode-split .image-gradient {
    position: absolute; top: 45%; left: 0; right: 0; height: 28%;
    z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(26,20,16,0.55) 50%,
      var(--bg) 100%);
  }
  .mode-split .text-area {
    position: absolute; bottom: 0; left: 0; right: 0; height: 42%;
    padding: 0 60px 100px;
    display: flex; flex-direction: column; justify-content: flex-end;
    z-index: 2;
  }

  /* === MODO FULL === */
  .mode-full .image-area {
    position: absolute; inset: 0; z-index: 0; overflow: hidden;
  }
  .mode-full .image-area img {
    width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.45) contrast(1.1);
  }
  .mode-full .image-area .gradient {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(26,20,16,0.1) 0%, rgba(26,20,16,0.85) 55%, rgba(26,20,16,0.97) 100%);
  }
  .mode-full .text-area {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 30px 60px 90px;
    display: flex; flex-direction: column; justify-content: flex-end;
    z-index: 2;
  }

  /* === MODO TEXT === */
  /* Sem imagem: texto centrado verticalmente para preencher o slide
     e evitar a metade superior vazia. CTA/assinatura ja ficam centrados
     pelo .layout-* override mais abaixo. */
  .mode-text .text-area {
    position: absolute; inset: 0;
    padding: 150px 60px 130px;
    display: flex; flex-direction: column; justify-content: center;
    z-index: 2;
  }

  /* === TEXTO === */
  .body { position: relative; }
  .body p { margin: 0 0 26px; }
  .body p:last-child { margin-bottom: 0; }
  .body strong { color: var(--acento); font-weight: 800; }
  .body em { color: var(--acento); font-style: italic; font-weight: 700; }

  .body {
    font-size: 124px; line-height: 1.02; font-weight: 600;
    letter-spacing: -0.02em;
  }
  /* Texto-puro (sem imagem) ocupa mais ainda — preenche o slide. */
  .mode-text .body { font-size: 132px; }
  .mode-full .body, .mode-split .body {
    text-shadow: 0 2px 16px rgba(0,0,0,0.4);
  }

  .layout-capa .body { font-size: 134px; font-weight: 800; }
  .mode-text.layout-capa .body { font-size: 144px; }
  .layout-cta .body { font-size: 100px; font-weight: 700; }
  .layout-cta .text-area { justify-content: center; }
  .layout-assinatura .body { font-size: 88px; font-weight: 600; }
  .layout-assinatura .text-area { justify-content: center; text-align: center; }

  .estrela { color: var(--ouro-folha); width: 60px; height: 60px; margin-top: 24px; line-height: 0; align-self: center; }
  .estrela svg { width: 100%; height: 100%; display: block; }
  .signature { margin-top: 16px; font-size: 22px; opacity: 0.7; }
</style>
</head>
<body>
<div id="slide">
  <div class="image-area" id="image-area" style="display:none"><img id="bg-img"/></div>
  <div class="image-gradient" id="image-gradient" style="display:none"></div>
  <div class="ghost-num" id="ghost-num"></div>
  <div class="brand" id="brand">
    <span class="icon">
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SyncHim">
        <g transform="translate(30,30)">
          <polygon points="0,-26 6,-9 23,-13 13,1 25,11 9,11 0,26 -6,9 -23,13 -13,-1 -25,-11 -9,-11"
            fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="3" fill="currentColor"/>
        </g>
      </svg>
    </span>
    <span class="name">SyncHim</span>
  </div>
  <div class="credit">© viviannedossantos</div>
  <div class="pagination" id="pagination"></div>
  <div class="text-area">
    <div class="body" id="body"></div>
    <div class="estrela" id="estrela" style="display:none">
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SyncHim">
        <g transform="translate(30,30)">
          <polygon points="0,-26 6,-9 23,-13 13,1 25,11 9,11 0,26 -6,9 -23,13 -13,-1 -25,-11 -9,-11"
            fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="3" fill="currentColor"/>
        </g>
      </svg>
    </div>
    <div class="signature" id="signature" style="display:none"></div>
  </div>
</div>
<script>
  function getData() { return window.SLIDE_DATA || null; }
  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderBody(src) {
    return (src||'').split(/\n\n+/).map(function(par) {
      var inline = escapeHtml(par).replace(/\*\*([\s\S]+?)\*\*/g,'<strong>$1</strong>').replace(/_([\s\S]+?)_/g,'<em>$1</em>').replace(/\n/g,'<br/>');
      return '<p>'+inline+'</p>';
    }).join('');
  }
  function fitToHeight(el, maxH, minPx) {
    var size = parseFloat(getComputedStyle(el).fontSize);
    var guard = 80;
    while (el.scrollHeight > maxH && size > minPx && guard-- > 0) { size -= 2; el.style.fontSize = size+'px'; }
  }
  function render() {
    var data = getData(); if (!data) return;
    var root = document.getElementById('slide');
    var layout = data.layout || 'conteudo';
    var imgUrl = data.imageUrl || (data.design && data.design.imageUrl);
    var imagePos = (data.design && data.design.imagePosition) || 'split';
    var mode = imgUrl ? (imagePos === 'full' ? 'full' : 'split') : 'text';
    root.className = 'mode-' + mode + ' layout-' + layout;

    if (imgUrl) {
      var imgArea = document.getElementById('image-area');
      imgArea.style.display = 'block';
      document.getElementById('bg-img').src = imgUrl;
      // gradient bridge so para split (em full ja ha overlay proprio)
      if (mode === 'split') {
        document.getElementById('image-gradient').style.display = 'block';
      }
    }

    // Paginação
    var total = data.totalSlides || 8;
    var idx = data.idx != null ? data.idx : 0;
    var pag = document.getElementById('pagination');
    for (var i = 0; i < total; i++) {
      var dot = document.createElement('div');
      dot.className = 'dot' + (i === idx ? ' active' : '');
      pag.appendChild(dot);
    }

    // Numero fantasma (so para conteudo sem imagem)
    var ghost = document.getElementById('ghost-num');
    ghost.textContent = String(idx + 1).padStart(2, '0');

    document.getElementById('body').innerHTML = renderBody(data.body || '');

    if (layout === 'cta' || layout === 'assinatura') {
      document.getElementById('estrela').style.display = 'block';
    }
    if (layout === 'assinatura') {
      var sig = document.getElementById('signature');
      sig.style.display = 'block';
      sig.textContent = 'Vivianne dos Santos';
    }

    var bodyEl = document.getElementById('body');
    // Texto-puro pode ocupar mais altura; com imagem fica restrito a metade
    // inferior + margem do gradiente.
    var maxH = mode === 'text' ? 1050 : 580;
    fitToHeight(bodyEl, maxH, 48);

    document.body.dataset.ready = '1';
  }
  document.fonts.ready.then(render);
</script>
</body>
</html>
